<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your Scene account</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/signage.css"><script src="/static/auth.js" defer></script></head>
<body class="auth-page"><main class="container"><h1>Verify your Scene account</h1><p>Use the code from your email in the browser where you started registration or recovery.</p><form id="onboard-form" hidden><label for="business-name">Business name</label><input id="business-name" minlength="2" maxlength="80" autocomplete="organization" required><label for="business-industry">Business type</label><select id="business-industry"><option value="auto">Automotive services</option><option value="restaurant">Restaurant</option><option value="barber">Barber / beauty</option><option value="retail">Retail</option></select><button type="submit">Create business workspace</button></form><form id="recover-form" hidden><label for="recover-email">Account email</label><input id="recover-email" type="email" autocomplete="email" maxlength="200" required><button type="submit">Request recovery code</button></form><form id="verify-form"><label for="code">Email verification code</label><input id="code" autocomplete="one-time-code" required maxlength="128"><button type="submit">Verify email</button></form><form id="password-form" hidden><label for="password">New password (12 or more characters)</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="submit">Change password</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="/">Return to Scene</a></p></main></body></html>
