name: SCENE tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests
        env:
          SCENE_DEMO: '1'
        run: python -m pytest -q tests
      - name: Founder's Test (new-business QR-to-lead lifecycle)
        env:
          SCENE_DEMO: '1'
        run: python -m pytest -q tests/test_api.py -k founder_gate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Guest submission regression tests
        run: node --test tests/frontend.test.cjs

  postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scene_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: scene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scene_test -d scene_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt
      - name: PostgreSQL migration and tenant reference checks
        env:
          SCENE_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          SCENE_TEST_POSTGRES_URL: postgresql://scene_test:disposable-ci-only@localhost:5432/scene_test
        run: python -m pytest -q tests/test_postgres.py tests/test_postgres_backup.py
      - name: Full API parity on restricted PostgreSQL runtime role
        env:
          SCENE_TEST_POSTGRES_URL: postgresql://scene_test:disposable-ci-only@localhost:5432/scene_test
          SCENE_TEST_API_BACKEND: postgres
        run: python -m pytest -q tests/test_api.py tests/test_backend.py tests/test_acceptance.py tests/test_managed_auth.py tests/test_auth_lifecycle.py tests/test_billing.py tests/test_mail.py
      - name: Founder's Test (restricted PostgreSQL backend)
        env:
          SCENE_TEST_POSTGRES_URL: postgresql://scene_test:disposable-ci-only@localhost:5432/scene_test
          SCENE_TEST_API_BACKEND: postgres
        run: python -m pytest -q tests/test_api.py -k founder_gate

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Mobile guest, inquiry, receipt and staff-access workflows
        env:
          SCENE_BROWSER_TESTS: '1'
        run: |
          mkdir -p test-artifacts
          python -m pytest -q tests/test_mobile.py --basetemp=test-artifacts/browser
      - name: Preserve synthetic browser screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-browser-evidence
          path: test-artifacts/browser
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t scene-qr-ci .
      - name: Verify non-demo startup and static assets
        shell: bash
        run: |
          docker run -d --name scene-smoke scene-qr-ci
          docker exec scene-smoke python -c "import psycopg; print('PostgreSQL driver present')"
          for attempt in {1..30}; do
            if docker exec scene-smoke python -c "import json,urllib.request; result=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz')); assert result == {'ok':True,'mode':'pilot'}; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/readyz')) == {'ok':True}; assert urllib.request.urlopen('http://127.0.0.1:8000/static/app.js').status == 200"; then
              docker exec -i scene-smoke python - < tests/container_smoke.py
              exit 0
            fi
            sleep 1
          done
          docker logs scene-smoke
          exit 1
      - name: Verify account and request persistence after container restart
        shell: bash
        run: |
          docker restart scene-smoke
          for attempt in {1..30}; do
            if docker exec scene-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"; then
              docker exec -i scene-smoke python - verify < tests/container_smoke.py
              exit 0
            fi
            sleep 1
          done
          docker logs scene-smoke
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm -f scene-smoke || true
